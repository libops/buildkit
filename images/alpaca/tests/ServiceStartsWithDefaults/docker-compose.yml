---
# Common to all services
x-common: &common
  restart: "no"

name: alpaca-servicestartswithdefaults
services:
  alpaca:
    <<: *common
    image: ${ALPACA:-libops/alpaca:local}
    environment:
      ALPACA_JMS_PASSWORD: test-broker-password
    depends_on:
      - activemq
  activemq:
    <<: *common
    image: ${ACTIVEMQ:-libops/activemq:local}
    environment:
      ACTIVEMQ_PASSWORD: test-broker-password
      ACTIVEMQ_WEB_ADMIN_PASSWORD: test-web-password
