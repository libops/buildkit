name: Build and Push Docker Images
on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - "ci/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "images/**"
      - "internal/**"
      - "docker-bake.hcl"
      - "Makefile"
  workflow_dispatch:
    inputs:
      image:
        description: "Single changed image to build with its dependents"
        required: false
        type: string
      all:
        description: "Build every image"
        required: false
        type: boolean
        default: false
      tag:
        description: "Fallback tag for unversioned images or non-main builds"
        required: false
        type: string
      version-tags:
        description: "Publish tags from the software version in each image"
        required: false
        type: boolean
        default: true
concurrency:
  group: ${{ github.ref }}-${{ inputs.tag && inputs.tag || github.ref_name }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    name: "lint ${{ inputs.tag && inputs.tag || github.ref_name }}"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6

      - name: lint
        run: |
          mapfile -d '' scripts < <(git grep -Ilz -E '^#!.*(ba)?sh')
          shellcheck "${scripts[@]}"

  plan:
    runs-on: ubuntu-24.04
    name: Plan affected images
    needs: lint
    outputs:
      images: ${{ steps.plan.outputs.images }}
      fallback_images: ${{ steps.plan.outputs.fallback_images }}
      level0: ${{ steps.plan.outputs.level0 }}
      level1: ${{ steps.plan.outputs.level1 }}
      level2: ${{ steps.plan.outputs.level2 }}
      level3: ${{ steps.plan.outputs.level3 }}
      level4: ${{ steps.plan.outputs.level4 }}
      tests: ${{ steps.plan.outputs.tests }}
      test_level0: ${{ steps.plan.outputs.test_level0 }}
      test_level1: ${{ steps.plan.outputs.test_level1 }}
      test_level2: ${{ steps.plan.outputs.test_level2 }}
      test_level3: ${{ steps.plan.outputs.test_level3 }}
      test_level4: ${{ steps.plan.outputs.test_level4 }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      sitectl_wp_image_tags: ${{ steps.plan.outputs.sitectl_wp_image_tags }}
      sitectl_omeka_s_image_tags: ${{ steps.plan.outputs.sitectl_omeka_s_image_tags }}
      sitectl_omeka_classic_image_tags: ${{ steps.plan.outputs.sitectl_omeka_classic_image_tags }}
      sitectl_ojs_image_tags: ${{ steps.plan.outputs.sitectl_ojs_image_tags }}
      sitectl_drupal_image_tags: ${{ steps.plan.outputs.sitectl_drupal_image_tags }}
      sitectl_isle_libops_image_tags: ${{ steps.plan.outputs.sitectl_isle_libops_image_tags }}
      sitectl_isle_images: ${{ steps.plan.outputs.sitectl_isle_images }}
      sitectl_create_smoke_matrix: ${{ steps.plan.outputs.sitectl_create_smoke_matrix }}
      sitectl_repository: ${{ steps.plan.outputs.sitectl_repository }}
      sitectl_ref: ${{ steps.plan.outputs.sitectl_ref }}
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test planner and repository contracts
        run: go test -count=1 ./...

      - id: plan
        name: Plan
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          IMAGE: ${{ inputs.image || '' }}
          ALL: ${{ inputs.all || false }}
          FALLBACK_TAG: ${{ inputs.tag && inputs.tag || github.ref_name }}
          VERSION_TAGS: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          args=(plan --head "$HEAD")

          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BASE")
          fi

          if [ -n "$IMAGE" ]; then
            args+=(--image "$IMAGE")
          fi

          if [ "$ALL" = "true" ]; then
            args+=(--all)
          fi

          ./ci/image-metadata.sh "${args[@]}" | tee build-plan.out
          cat build-plan.out >> "$GITHUB_OUTPUT"

          FALLBACK_IMAGES="$(sed -n 's/^images=//p' build-plan.out)"
          if [ "$EVENT_NAME" = "push" ] &&
             [ "$REF_NAME" != "$DEFAULT_BRANCH" ] &&
             [ "$VERSION_TAGS" != "true" ]; then
            MERGE_BASE="$(git merge-base "$HEAD" "origin/${DEFAULT_BRANCH}")"
            FALLBACK_IMAGES="$(
              ./ci/image-metadata.sh plan --base "$MERGE_BASE" --head "$HEAD" |
                sed -n 's/^images=//p'
            )"
          fi
          echo "fallback_images=${FALLBACK_IMAGES}" >> "$GITHUB_OUTPUT"

          mode="fallback"
          if [ "$VERSION_TAGS" = "true" ]; then
            mode="version"
          fi
          first_tag() {
            ./ci/image-metadata.sh first-tag "$1" "$mode" "$FALLBACK_TAG"
          }

          planned_tag_assignment() {
            local service="$1"
            local image="$2"
            if grep -Fq "\"${image}\"" build-plan.out; then
              printf '%s=%s' "$service" "$(first_tag "$image")"
            fi
          }

          add_smoke_row() {
            local plugin="$1"
            local packages="$2"
            local package_versions="$3"
            local create_args="$4"
            local image_tags="$5"
            local images="$6"
            local local_plugin_repository="${7:-}"
            local local_plugin_ref="${8:-main}"
            local local_plugin_path="${9:-}"
            if [ -z "${image_tags// }" ]; then
              return
            fi
            smoke_matrix="$(
              jq -c \
                --arg plugin "$plugin" \
                --arg packages "$packages" \
                --arg package_versions "$package_versions" \
                --arg create_args "$create_args" \
                --arg image_tags "$image_tags" \
                --arg images "$images" \
                --arg local_plugin_repository "$local_plugin_repository" \
                --arg local_plugin_ref "$local_plugin_ref" \
                --arg local_plugin_path "$local_plugin_path" \
                --from-file ci/append-smoke-row.jq <<<"$smoke_matrix"
            )"
          }

          coordinated_template_args() {
            local repository="$1"
            local branch="${GITHUB_REF_NAME}"

            if [ "${branch}" = "main" ]; then
              return
            fi
            if [[ ! "${branch}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Skipping coordinated template branch with unsafe ref name: ${branch}" >&2
              return
            fi
            if git ls-remote --exit-code --heads "${repository}" "refs/heads/${branch}" >/dev/null 2>&1; then
              printf '%s' "--template-repo ${repository} --template-branch ${branch}"
            fi
          }

          sitectl_wp_image_tags="$(planned_tag_assignment wp wp-php84)"
          sitectl_omeka_s_image_tags="$(planned_tag_assignment omeka-s omeka-s-php84)"
          sitectl_omeka_classic_image_tags="$(planned_tag_assignment omeka-classic omeka-classic-php84)"
          sitectl_ojs_image_tags="$(planned_tag_assignment ojs ojs-php84)"
          sitectl_drupal_image_tags="$(planned_tag_assignment drupal drupal-php84)"
          sitectl_isle_libops_image_tags="$(planned_tag_assignment drupal islandora-php84)"
          sitectl_isle_images=""
          sitectl_wp_create_args="$(coordinated_template_args https://github.com/libops/wp)"
          sitectl_omeka_s_create_args="$(coordinated_template_args https://github.com/libops/omeka-s)"
          sitectl_omeka_classic_create_args="$(coordinated_template_args https://github.com/libops/omeka-classic)"
          sitectl_ojs_create_args="$(coordinated_template_args https://github.com/libops/ojs)"
          sitectl_drupal_create_args="$(coordinated_template_args https://github.com/libops/drupal)"
          sitectl_isle_template_args="$(coordinated_template_args https://github.com/libops/isle)"
          if [ -z "${sitectl_isle_template_args}" ]; then
            sitectl_isle_template_args="--template-repo https://github.com/libops/isle --template-branch main"
          fi
          sitectl_isle_create_args="${sitectl_isle_template_args} --fcrepo off --blazegraph off --isle-file-system-uri private --iiif triplet --iiif-topology disabled --bot-mitigation off"
          sitectl_repository=""
          sitectl_ref="main"
          if [ -n "$(coordinated_template_args https://github.com/libops/sitectl)" ]; then
            sitectl_repository="libops/sitectl"
            sitectl_ref="${GITHUB_REF_NAME}"
          fi
          sitectl_isle_packages="sitectl sitectl-isle sitectl-drupal"
          sitectl_isle_package_versions="sitectl=1.8.2 sitectl-isle=1.5.0 sitectl-drupal=1.3.0"
          sitectl_isle_plugin_repository=""
          sitectl_isle_plugin_ref="main"
          sitectl_isle_plugin_path=""
          if [ -n "$(coordinated_template_args https://github.com/libops/sitectl-isle)" ]; then
            sitectl_isle_packages="sitectl sitectl-drupal"
            sitectl_isle_package_versions="sitectl=1.8.2 sitectl-drupal=1.3.0"
            sitectl_isle_plugin_repository="libops/sitectl-isle"
            sitectl_isle_plugin_ref="${GITHUB_REF_NAME}"
            sitectl_isle_plugin_path="sitectl-isle-source"
          fi

          smoke_matrix='[]'
          add_smoke_row "wp" "sitectl sitectl-wp" "sitectl=1.8.2 sitectl-wp=2.0.0" "$sitectl_wp_create_args" "$sitectl_wp_image_tags" ""
          add_smoke_row "omeka-s" "sitectl sitectl-omeka-s" "sitectl=1.8.2 sitectl-omeka-s=1.2.0" "$sitectl_omeka_s_create_args" "$sitectl_omeka_s_image_tags" ""
          add_smoke_row "omeka-classic" "sitectl sitectl-omeka-classic" "sitectl=1.8.2 sitectl-omeka-classic=1.2.0" "$sitectl_omeka_classic_create_args" "$sitectl_omeka_classic_image_tags" ""
          add_smoke_row "ojs" "sitectl sitectl-ojs" "sitectl=1.8.2 sitectl-ojs=1.2.0" "$sitectl_ojs_create_args" "$sitectl_ojs_image_tags" ""
          add_smoke_row "drupal" "sitectl sitectl-drupal" "sitectl=1.8.2 sitectl-drupal=1.3.0" "$sitectl_drupal_create_args" "$sitectl_drupal_image_tags" ""
          add_smoke_row "isle" "$sitectl_isle_packages" "$sitectl_isle_package_versions" "$sitectl_isle_create_args" "$sitectl_isle_libops_image_tags" "$sitectl_isle_images" "$sitectl_isle_plugin_repository" "$sitectl_isle_plugin_ref" "$sitectl_isle_plugin_path"

          {
            echo "sitectl_wp_image_tags=${sitectl_wp_image_tags}"
            echo "sitectl_omeka_s_image_tags=${sitectl_omeka_s_image_tags}"
            echo "sitectl_omeka_classic_image_tags=${sitectl_omeka_classic_image_tags}"
            echo "sitectl_ojs_image_tags=${sitectl_ojs_image_tags}"
            echo "sitectl_drupal_image_tags=${sitectl_drupal_image_tags}"
            echo "sitectl_isle_libops_image_tags=${sitectl_isle_libops_image_tags}"
            echo "sitectl_isle_images=${sitectl_isle_images}"
            echo "sitectl_create_smoke_matrix=${smoke_matrix}"
            echo "sitectl_repository=${sitectl_repository}"
            echo "sitectl_ref=${sitectl_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Images: ${{ steps.plan.outputs.images }}"
          echo "Fallback-tag images: ${{ steps.plan.outputs.fallback_images }}"
          echo "Tests: ${{ steps.plan.outputs.tests }}"
          echo "Level 0 tests: ${{ steps.plan.outputs.test_level0 }}"
          echo "Level 1 tests: ${{ steps.plan.outputs.test_level1 }}"
          echo "Level 2 tests: ${{ steps.plan.outputs.test_level2 }}"
          echo "Level 3 tests: ${{ steps.plan.outputs.test_level3 }}"
          echo "Level 4 tests: ${{ steps.plan.outputs.test_level4 }}"
          echo "sitectl wp image tags: ${{ steps.plan.outputs.sitectl_wp_image_tags }}"
          echo "sitectl omeka-s image tags: ${{ steps.plan.outputs.sitectl_omeka_s_image_tags }}"
          echo "sitectl omeka-classic image tags: ${{ steps.plan.outputs.sitectl_omeka_classic_image_tags }}"
          echo "sitectl ojs image tags: ${{ steps.plan.outputs.sitectl_ojs_image_tags }}"
          echo "sitectl drupal image tags: ${{ steps.plan.outputs.sitectl_drupal_image_tags }}"
          echo "sitectl isle libops image tags: ${{ steps.plan.outputs.sitectl_isle_libops_image_tags }}"
          echo "sitectl create smoke matrix: ${{ steps.plan.outputs.sitectl_create_smoke_matrix }}"

  build-level-0:
    if: ${{ needs.plan.outputs.level0 != '[]' }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.level0) }}
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-level-1:
    if: ${{ always() && needs.plan.outputs.level1 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-0]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.level1) }}
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-level-2:
    if: ${{ always() && needs.plan.outputs.level2 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-1]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.level2) }}
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-level-3:
    if: ${{ always() && needs.plan.outputs.level3 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-2]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.level3) }}
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-level-4:
    if: ${{ always() && needs.plan.outputs.level4 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-3]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.level4) }}
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  test-level-0:
    if: ${{ always() && needs.plan.outputs.test_level0 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-0]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.test_level0) }}
    uses: ./.github/workflows/test.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    permissions:
      contents: read
      packages: read

  test-level-1:
    if: ${{ always() && needs.plan.outputs.test_level1 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-1]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.test_level1) }}
    uses: ./.github/workflows/test.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    permissions:
      contents: read
      packages: read

  test-level-2:
    if: ${{ always() && needs.plan.outputs.test_level2 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-2]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.test_level2) }}
    uses: ./.github/workflows/test.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    permissions:
      contents: read
      packages: read

  test-level-3:
    if: ${{ always() && needs.plan.outputs.test_level3 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-3]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.test_level3) }}
    uses: ./.github/workflows/test.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    permissions:
      contents: read
      packages: read

  test-level-4-matrix:
    if: ${{ always() && needs.plan.outputs.test_level4 != '[]' && !cancelled() && !failure() }}
    needs: [plan, build-level-4]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.test_level4) }}
    uses: ./.github/workflows/test.yml
    with:
      image: ${{ matrix.image }}
      repository: libops
      fallback-tag: ${{ inputs.tag && inputs.tag || github.ref_name }}
      version-tags: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.version-tags || false }}
      build-images: ${{ needs.plan.outputs.fallback_images }}
    permissions:
      contents: read
      packages: read

  test-level-4:
    if: ${{ always() }}
    needs: [test-level-4-matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify level-4 matrix
        env:
          RESULT: ${{ needs.test-level-4-matrix.result }}
        run: |
          if [[ "${RESULT}" != "success" && "${RESULT}" != "skipped" ]]; then
            echo "Level-4 matrix result: ${RESULT}" >&2
            exit 1
          fi

  sitectl-create-smoke-test:
    if: ${{ always() && needs.plan.outputs.sitectl_create_smoke_matrix != '[]' && !cancelled() && !failure() }}
    needs: [plan, test-level-0, test-level-1, test-level-2, test-level-3, test-level-4]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.sitectl_create_smoke_matrix) }}

    uses: libops/.github/.github/workflows/sitectl-create-smoke-test.yaml@ac5db178c5335b456c20f28aa9f447d93c572aa9 # main
    with:
      plugin: ${{ matrix.plugin }}
      create-definition: default
      create-args: --yolo ${{ matrix.create-args }}
      checkout-source: template
      project-path: generated-${{ matrix.plugin }}
      image-tags: ${{ matrix.image-tags }}
      images: ${{ matrix.images }}
      packages: ${{ matrix.packages }}
      package-versions: ${{ matrix.package-versions }}
      allow-unversioned-packages: false
      local-plugin-repository: ${{ matrix.local-plugin-repository }}
      local-plugin-ref: ${{ matrix.local-plugin-ref }}
      local-plugin-path: ${{ matrix.local-plugin-path }}
      sitectl-repository: ${{ needs.plan.outputs.sitectl_repository }}
      sitectl-ref: ${{ needs.plan.outputs.sitectl_ref }}
    permissions:
      contents: read
